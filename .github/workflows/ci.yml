name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Change "app" si ton code est ailleurs (., frontend, web, etc.)
env:
  WORKDIR: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Install deps (ci si lockfile)
        if: ${{ hashFiles(format('{0}/package-lock.json', env.WORKDIR)) != '' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ hashFiles(format('{0}/package-lock.json', env.WORKDIR)) == '' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present
