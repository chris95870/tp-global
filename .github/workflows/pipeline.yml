name: CI/CD

on:
  push:
    branches: [ dev, main ]

env:
  WORKDIR: app
  SSH_USER: devops
  PORT_DEV: "2222"
  PORT_PROD: "2200"
  APP_PORT: "8080"       # gardé au cas où tu en aies besoin plus tard
  HEALTH_PATH: "/health" # idem

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lf
        run: |
          [ -f "$WORKDIR/package-lock.json" ] && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible --------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # DEV key
      - name: Start ssh-agent & add DEV key
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KEY_B64: ${{ secrets.DEV_SSH_KEY_B64 }}
        run: |
          eval "$(ssh-agent -s)"
          if [ -n "$DEV_SSH_KEY_B64" ]; then
            echo "$DEV_SSH_KEY_B64" | base64 -d > /tmp/id_dev || { echo "::error::Base64 invalide pour DEV_SSH_KEY_B64"; exit 1; }
          elif [ -n "$DEV_SSH_KEY" ]; then
            printf '%s\n' "$DEV_SSH_KEY" | tr -d '\r' > /tmp/id_dev
          else
            echo "::error::Missing DEV_SSH_KEY or DEV_SSH_KEY_B64"; exit 1
          fi
          chmod 600 /tmp/id_dev
          ssh-keygen -yf /tmp/id_dev >/dev/null 2>&1 || { echo "::error::DEV key invalide ou chiffrée (passphrase)."; exit 1; }
          ssh-add /tmp/id_dev

      # PROD key
      - name: Start ssh-agent & add PROD key
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          eval "$(ssh-agent -s)"
          if [ -n "$PROD_SSH_KEY_B64" ]; then
            echo "$PROD_SSH_KEY_B64" | base64 -d > /tmp/id_prod || { echo "::error::Base64 invalide pour PROD_SSH_KEY_B64"; exit 1; }
          elif [ -n "$PROD_SSH_KEY" ]; then
            printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > /tmp/id_prod
          else
            echo "::error::Missing PROD_SSH_KEY or PROD_SSH_KEY_B64"; exit 1
          fi
          chmod 600 /tmp/id_prod
          ssh-keygen -yf /tmp/id_prod >/dev/null 2>&1 || { echo "::error::PROD key invalide ou chiffrée (passphrase)."; exit 1; }
          ssh-add /tmp/id_prod

      # Inventaire CI (secrets si dispos, sinon fallback inventaires versionnés)
      - name: Generate CI inventory (with fallback)
        id: ciinv
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -e
          mkdir -p ansible/inventory
          INV_OUT="ansible/inventory/ci.ini"

          first_host() {
            awk '
              /^\[/ {next}
              /^[[:space:]]*$/ {next}
              /^[[:space:]]*#/ {next}
              {print $1; exit}
            ' "$1"
          }

          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            host="${DEV_HOST}"
            if [ -z "$host" ] && [ -f ansible/inventory/dev.ini ]; then
              host="$(first_host ansible/inventory/dev.ini)"
              echo "Note: DEV_HOST secret absent, fallback → $host"
            fi
            if [ -z "$host" ]; then
              echo "::error::Aucun hôte DEV. Renseigne DEV_HOST ou mets un host dans ansible/inventory/dev.ini"
              exit 1
            fi
            printf "[web]\n%s ansible_user=%s ansible_port=%s\n" "$host" "$SSH_USER" "$PORT_DEV" > "$INV_OUT"
          else
            host="${PROD_HOST}"
            if [ -z "$host" ] && [ -f ansible/inventory/prod.ini ]; then
              host="$(first_host ansible/inventory/prod.ini)"
              echo "Note: PROD_HOST secret absent, fallback → $host"
            fi
            if [ -z "$host" ]; then
              echo "::error::Aucun hôte PROD. Renseigne PROD_HOST ou mets un host dans ansible/inventory/prod.ini"
              exit 1
            fi
            printf "[web]\n%s ansible_user=%s ansible_port=%s\n" "$host" "$SSH_USER" "$PORT_PROD" > "$INV_OUT"
          fi

          echo "path=$INV_OUT" >> "$GITHUB_OUTPUT"
          echo "== Generated inventory ==" && cat "$INV_OUT"

      - name: Seed known_hosts
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            host="${DEV_HOST}"
            [ -z "$host" ] && host="$(awk '/^\[/{next} /^[[:space:]]*$/{next} /^[[:space:]]*#/{next} {print $1; exit}' ansible/inventory/dev.ini)"
            ssh-keyscan -p "${PORT_DEV}" "$host" >> ~/.ssh/known_hosts || true
          else
            host="${PROD_HOST}"
            [ -z "$host" ] && host="$(awk '/^\[/{next} /^[[:space:]]*$/{next} /^[[:space:]]*#/{next} {print $1; exit}' ansible/inventory/prod.ini)"
            ssh-keyscan -p "${PORT_PROD}" "$host" >> ~/.ssh/known_hosts || true
          fi

      # Déploiement
      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i "${{ steps.ciinv.outputs.path }}" ansible/playbooks/deploy.yml --extra-vars "target_env=dev"

      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i "${{ steps.ciinv.outputs.path }}" ansible/playbooks/deploy.yml --extra-vars "target_env=prod"
