name: CI/CD

on:
  push:
    branches: [ dev, main ]

# 🔧 Variables à adapter
env:
  WORKDIR: app            # dossier qui contient package.json
  HOST_DEV: 127.0.0.1     # hôte serveur DEV
  HOST_PROD: 127.0.0.1    # hôte serveur PROD
  PORT_DEV: "2222"        # port SSH DEV
  PORT_PROD: "2200"       # port SSH PROD

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debug utile pour vérifier les chemins
      - name: Debug paths
        run: |
          echo "PWD=$(pwd)"
          echo "WORKDIR=$WORKDIR"
          ls -la
          ls -la "$WORKDIR" || true

      - name: Detect lockfile
        id: lf
        run: |
          if [ -f "$WORKDIR/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Node + cache npm SI lockfile existe
      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      # Sinon sans cache
      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install deps
      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      # Qualité / tests / build
      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible --------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # ⬇️ Ajout de la clé SSH depuis les secrets + log de la clé publique
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: true

      # Pré-remplir known_hosts pour éviter les prompts (adapter HOST/PORT)
      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT_DEV" "$HOST_DEV" >> ~/.ssh/known_hosts || true
          ssh-keyscan -p "$PORT_PROD" "$HOST_PROD" >> ~/.ssh/known_hosts || true

      # Deploy DEV si push sur dev
      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      # Deploy PROD si push sur main
      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"
