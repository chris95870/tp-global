name: CI/CD

on:
  push:
    branches: [ dev, main ]

# Variables à adapter
env:
  WORKDIR: app
  HOST_DEV: 127.0.0.1
  HOST_PROD: 127.0.0.1
  PORT_DEV: "2222"
  PORT_PROD: "2200"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          echo "PWD=$(pwd)"
          echo "WORKDIR=$WORKDIR"
          ls -la
          ls -la "$WORKDIR" || true

      - name: Detect lockfile
        id: lf
        run: |
          if [ -f "$WORKDIR/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible --------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # 🔐 Charger la clé DEV uniquement sur la branche dev
      - name: Add SSH key (DEV)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
          log-public-key: true

      # 🔐 Charger la clé PROD uniquement sur la branche main
      - name: Add SSH key (PROD)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
          log-public-key: true

      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ssh-keyscan -p "$PORT_DEV" "$HOST_DEV" >> ~/.ssh/known_hosts || true
          else
            ssh-keyscan -p "$PORT_PROD" "$HOST_PROD" >> ~/.ssh/known_hosts || true
          fi

      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"
