name: CI/CD

on:
  push:
    branches: [ dev, main ]

env:
  # 👇 Mets ici le sous-dossier où se trouve TON package.json
  WORKDIR: app

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Petit debug en cas d'erreur de chemin
      - name: Debug tree
        run: |
          echo "Repo root:" && pwd
          ls -la
          echo "Contents of \$WORKDIR:" && ls -la "$WORKDIR" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      # Install deps (npm ci si lockfile présent, sinon npm install)
      - name: Install deps (ci si lockfile)
        if: ${{ hashFiles(format('{0}/package-lock.json', env.WORKDIR)) != '' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ hashFiles(format('{0}/package-lock.json', env.WORKDIR)) == '' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # ---- Déploiement Ansible conditionnel ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Seed known_hosts (optionnel)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts || true
          ssh-keyscan -p 2200 127.0.0.1 >> ~/.ssh/known_hosts || true

      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"
