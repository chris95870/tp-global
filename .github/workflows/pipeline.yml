name: CI-CD Multi-Env

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Test
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}

      - name: SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts || true
          ssh-keyscan -p 2200 127.0.0.1 >> ~/.ssh/known_hosts || true

      - name: Deploy DEV or PROD
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            ansible -i ansible/inventory/dev.ini web -m ping
            ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy-dev.yml
          else
            ansible -i ansible/inventory/prod.ini web -m ping
            ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy-prod.yml
          fi
