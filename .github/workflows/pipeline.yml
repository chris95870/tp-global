name: CI/CD

on:
  push:
    branches: [ dev, main ]

# ⚙️ Chemin du projet Node (dossier qui contient package.json)
env:
  WORKDIR: app

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debug utile pour valider les chemins
      - name: Debug paths
        run: |
          echo "PWD=$(pwd)"
          echo "WORKDIR=$WORKDIR"
          ls -la
          ls -la "$WORKDIR" || true

      # Détection du lockfile pour éviter l'erreur "Some specified paths were not resolved"
      - name: Detect lockfile
        id: lf
        run: |
          if [ -f "$WORKDIR/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Node + cache npm SI le lockfile existe
      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      # Node SANS cache sinon (évite l'erreur de chemins non résolus)
      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install deps
      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      # Qualité / tests / build
      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible (cond. par branche) --------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Optionnel: pré-remplir known_hosts (adapte host/ports à ton infra)
      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 127.0.0.1 >> ~/.ssh/known_hosts || true
          ssh-keyscan -p 2200 127.0.0.1 >> ~/.ssh/known_hosts || true

      # Deploy DEV si push sur dev
      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      # Deploy PROD si push sur main
      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"
