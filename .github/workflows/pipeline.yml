name: CI/CD

on:
  push:
    branches: [ dev, main ]

env:
  WORKDIR: app
  HOST_DEV: 127.0.0.1
  HOST_PROD: 127.0.0.1
  PORT_DEV: "2222"
  PORT_PROD: "2200"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          echo "PWD=$(pwd)"
          echo "WORKDIR=$WORKDIR"
          ls -la
          ls -la "$WORKDIR" || true

      - name: Detect lockfile
        id: lf
        run: |
          if [ -f "$WORKDIR/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible --------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # 🔐 Démarrage ssh-agent + ajout de la clé DEV (branche dev)
      - name: Start ssh-agent & add DEV key
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          if [ -z "$DEV_SSH_KEY" ]; then
            echo "::error::Missing secret DEV_SSH_KEY"
            exit 1
          fi
          eval "$(ssh-agent -s)"
          # Écrit la clé, supprime les \r (copie Windows), fixe les permissions
          printf '%s\n' "$DEV_SSH_KEY" | tr -d '\r' > /tmp/id_dev
          chmod 600 /tmp/id_dev
          # (Optionnel) vérifie l'entête
          head -n1 /tmp/id_dev | grep -E 'BEGIN (OPENSSH|RSA) PRIVATE KEY' >/dev/null || { echo "::error::DEV_SSH_KEY: format invalide"; exit 1; }
          ssh-add /tmp/id_dev

      # 🔐 Démarrage ssh-agent + ajout de la clé PROD (branche main)
      - name: Start ssh-agent & add PROD key
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -z "$PROD_SSH_KEY" ]; then
            echo "::error::Missing secret PROD_SSH_KEY"
            exit 1
          fi
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > /tmp/id_prod
          chmod 600 /tmp/id_prod
          head -n1 /tmp/id_prod | grep -E 'BEGIN (OPENSSH|RSA) PRIVATE KEY' >/dev/null || { echo "::error::PROD_SSH_KEY: format invalide"; exit 1; }
          ssh-add /tmp/id_prod

      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ssh-keyscan -p "$PORT_DEV" "$HOST_DEV" >> ~/.ssh/known_hosts || true
          else
            ssh-keyscan -p "$PORT_PROD" "$HOST_PROD" >> ~/.ssh/known_hosts || true
          fi

      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"
