name: CI/CD

on:
  push:
    branches: [ dev, main ]

env:
  WORKDIR: app
  HOST_DEV: 127.0.0.1
  HOST_PROD: 127.0.0.1
  PORT_DEV: "2222"
  PORT_PROD: "2200"
  APP_PORT: "8080"          # 🔧 port exposé côté serveur (host)
  HEALTH_PATH: "/health"    # 🔧 chemin du healthcheck (mets "/" si tu n'en as pas)

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lf
        run: |
          [ -f "$WORKDIR/package-lock.json" ] && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node (with cache)
        if: ${{ steps.lf.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Setup Node (no cache)
        if: ${{ steps.lf.outputs.found == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (ci si lockfile)
        if: ${{ steps.lf.outputs.found == 'true' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm ci --no-audit --no-fund

      - name: Install deps (fallback sans lockfile)
        if: ${{ steps.lf.outputs.found == 'false' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.WORKDIR }}
        run: npm run lint --if-present

      - name: Tests
        working-directory: ${{ env.WORKDIR }}
        run: npm test --if-present

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build --if-present

      # -------- Déploiement Ansible --------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # DEV: ssh-agent + clé (brute ou base64)
      - name: Start ssh-agent & add DEV key
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KEY_B64: ${{ secrets.DEV_SSH_KEY_B64 }}
        run: |
          eval "$(ssh-agent -s)"
          if [ -n "$DEV_SSH_KEY_B64" ]; then
            echo "$DEV_SSH_KEY_B64" | base64 -d > /tmp/id_dev || { echo "::error::Base64 invalide pour DEV_SSH_KEY_B64"; exit 1; }
          elif [ -n "$DEV_SSH_KEY" ]; then
            printf '%s\n' "$DEV_SSH_KEY" | tr -d '\r' > /tmp/id_dev
          else
            echo "::error::Missing DEV_SSH_KEY or DEV_SSH_KEY_B64"; exit 1
          fi
          chmod 600 /tmp/id_dev
          ssh-keygen -yf /tmp/id_dev >/dev/null 2>&1 || { echo "::error::DEV key invalide ou chiffrée (passphrase). Fournis une clé OpenSSH non chiffrée."; exit 1; }
          ssh-add /tmp/id_dev

      # PROD: ssh-agent + clé (brute ou base64)
      - name: Start ssh-agent & add PROD key
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
        run: |
          eval "$(ssh-agent -s)"
          if [ -n "$PROD_SSH_KEY_B64" ]; then
            echo "$PROD_SSH_KEY_B64" | base64 -d > /tmp/id_prod || { echo "::error::Base64 invalide pour PROD_SSH_KEY_B64"; exit 1; }
          elif [ -n "$PROD_SSH_KEY" ]; then
            printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > /tmp/id_prod
          else
            echo "::error::Missing PROD_SSH_KEY or PROD_SSH_KEY_B64"; exit 1
          fi
          chmod 600 /tmp/id_prod
          ssh-keygen -yf /tmp/id_prod >/dev/null 2>&1 || { echo "::error::PROD key invalide ou chiffrée (passphrase). Fournis une clé OpenSSH non chiffrée."; exit 1; }
          ssh-add /tmp/id_prod

      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ssh-keyscan -p "$PORT_DEV" "$HOST_DEV" >> ~/.ssh/known_hosts || true
          else
            ssh-keyscan -p "$PORT_PROD" "$HOST_PROD" >> ~/.ssh/known_hosts || true
          fi

      # Lancer le déploiement
      - name: Deploy to DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=dev"

      - name: Deploy to PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy.yml \
            --extra-vars "target_env=prod"

      # -------- Smoke tests après déploiement --------
      - name: Smoke test DEV
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          ansible -i ansible/inventory/dev.ini web -m wait_for -a "host=127.0.0.1 port=${APP_PORT} timeout=60 state=started"
          ansible -i ansible/inventory/dev.ini web -m uri -a "url=http://127.0.0.1:${APP_PORT}${HEALTH_PATH} status_code=200"

      - name: Smoke test PROD
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          ansible -i ansible/inventory/prod.ini web -m wait_for -a "host=127.0.0.1 port=${APP_PORT} timeout=60 state=started"
          ansible -i ansible/inventory/prod.ini web -m uri -a "url=http://127.0.0.1:${APP_PORT}${HEALTH_PATH} status_code=200"
